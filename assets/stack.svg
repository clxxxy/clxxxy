<svg viewBox="0 0 1000 302" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" lang="pt-BR" aria-label="Tecnologias — desenvolvimento Python, IA generativa, LLMOps, agentes, engenharia de prompts, aprendizado de máquina, dados, visualização, automação e criação">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s} .a7{animation-delay:.7s} .a8{animation-delay:.8s} .a9{animation-delay:.9s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <line x1="138" y1="8" x2="138" y2="294" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <text class="mono rise a1" x="48" y="32"  font-size="12" fill="var(--muted)" letter-spacing="2">CÓDIGO</text>
  <text class="mono rise a1" x="154" y="32"  font-size="15" fill="var(--bone)">Python · Desenvolvimento de software</text>

  <text class="mono rise a2" x="48" y="64"  font-size="12" fill="var(--muted)" letter-spacing="2">IA</text>
  <text class="mono rise a2" x="154" y="64"  font-size="15" fill="var(--bone)">Inteligência artificial · IA generativa · Assistentes virtuais</text>

  <text class="mono rise a3" x="48" y="96"  font-size="12" fill="var(--muted)" letter-spacing="2">LLMOPS</text>
  <text class="mono rise a3" x="154" y="96"  font-size="15" fill="var(--bone)">LLMOps · LangChain · OpenAI · RAG</text>

  <text class="mono rise a4" x="49" y="128" font-size="12" fill="var(--muted)" letter-spacing="2">AGENTES</text>
  <text class="mono rise a4" x="154" y="128" font-size="15" fill="var(--bone)">Agentes/multiagentes · Instruções para IA · Engenharia de prompts</text>

  <text class="mono rise a5" x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2">MODELOS</text>
  <text class="mono rise a5" x="154" y="160" font-size="15" fill="var(--bone)">TensorFlow · Scikit-learn · RANSACRegressor · Visão computacional</text>

  <text class="mono rise a6" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">DADOS</text>
  <text class="mono rise a6" x="154" y="192" font-size="15" fill="var(--bone)">Ciência de dados · Análise de dados · PostgreSQL · Séries temporais</text>

  <text class="mono rise a7" x="49" y="224" font-size="12" fill="var(--muted)" letter-spacing="2">VISUAL</text>
  <text class="mono rise a7" x="154" y="224" font-size="15" fill="var(--bone)">Visualização de dados · Power BI · Streamlit</text>

  <text class="mono rise a8" x="49" y="256" font-size="12" fill="var(--muted)" letter-spacing="2">AUTOMAÇÃO</text>
  <text class="mono rise a8" x="154" y="256" font-size="15" fill="var(--bone)">n8n · Integração de LLMs · Automação de processos</text>

  <text class="mono rise a9" x="48" y="288" font-size="12" fill="var(--muted)" letter-spacing="2">CRIATIVO</text>
  <text class="mono rise a9" x="154" y="288" font-size="15" fill="var(--bone)">Photoshop · FL Studio</text>

</svg>
