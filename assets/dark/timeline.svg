<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" lang="pt-BR" aria-label="Trajetória de Cleydson Junior — AGO 2022: Início da graduação; JUL 2023: PROEX · IA na Educação; JUL 2024: PROEX · Artigo CSBC; MAI 2025: TRIL · Cebraspe; JUL 2025: TRIL · FICAMP; OUT 2025: Ford Motor Company; SET 2026: YAITEC Solutions">
  <style>
    :root { --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.9s}.m3{animation-delay:1.4s}.m4{animation-delay:1.7s}.m5{animation-delay:2.0s}.m6{animation-delay:2.3s}.m7{animation-delay:2.6s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 1060px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
</style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">MINHA TRAJETÓRIA</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">~/ Linha do tempo</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <g class="m m1">
    <circle cx="140" cy="125" r="4" fill="var(--bone)"/>
    <line x1="140" y1="121" x2="140" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="140" y="74" font-size="11" letter-spacing="2" text-anchor="middle">AGO 2022</text>
    <text fill="var(--bone)" class="mono" x="140" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Início da graduação</text>
  </g>

  <g class="m m2">
    <circle cx="293" cy="125" r="4" fill="var(--bone)"/>
    <line x1="293" y1="129" x2="293" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="293" y="172" font-size="11" letter-spacing="2" text-anchor="middle">JUL 2023</text>
    <text fill="var(--bone)" class="mono" x="293" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">PROEX · IA na Educação</text>
  </g>

  <g class="m m3">
    <circle cx="446" cy="125" r="4" fill="var(--bone)"/>
    <line x1="446" y1="121" x2="446" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="446" y="74" font-size="11" letter-spacing="2" text-anchor="middle">JUL 2024</text>
    <text fill="var(--bone)" class="mono" x="446" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">PROEX · Artigo CSBC</text>
  </g>

  <g class="m m4">
    <circle cx="600" cy="125" r="4" fill="var(--bone)"/>
    <line x1="600" y1="129" x2="600" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="600" y="172" font-size="11" letter-spacing="2" text-anchor="middle">MAI 2025</text>
    <text fill="var(--bone)" class="mono" x="600" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">TRIL · Cebraspe</text>
  </g>

  <g class="m m5">
    <circle cx="754" cy="125" r="4" fill="var(--bone)"/>
    <line x1="754" y1="121" x2="754" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="754" y="74" font-size="11" letter-spacing="2" text-anchor="middle">JUL 2025</text>
    <text fill="var(--bone)" class="mono" x="754" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">TRIL · FICAMP</text>
  </g>

  <g class="m m6">
    <circle cx="907" cy="125" r="4" fill="var(--bone)"/>
    <line x1="907" y1="129" x2="907" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="907" y="172" font-size="11" letter-spacing="2" text-anchor="middle">OUT 2025</text>
    <text fill="var(--bone)" class="mono" x="907" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Ford Motor Company</text>
  </g>

  <g class="m m7">
    <circle class="ring" cx="1060" cy="125" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="pulse" cx="1060" cy="125" r="4.5" fill="var(--accent)"/>
    <line x1="1060" y1="121" x2="1060" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="1060" y="74" font-size="11" letter-spacing="2" text-anchor="middle">SET 2026</text>
    <text fill="var(--bone)" class="mono" x="1060" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">YAITEC Solutions</text>
  </g>
</svg>
